<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>WILD OHM — Dark Ritual</title>
  <meta name="description" content="WILD OHM — Dark Ritual. Les 17 rites." />
  <link rel="icon" href="icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="WILD OHM" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="WILD OHM — Dark Ritual" />
  <meta property="og:description" content="Les 17 rites." />
  <meta property="og:image" content="https://wild-ohm-demo.vercel.app/icons/og.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="WILD OHM — Dark Ritual" />
  <meta name="twitter:image" content="https://wild-ohm-demo.vercel.app/icons/og.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #050505;
      --bronze: #c4a574;
      --bronze-dim: #8a7350;
      --violet: #b07cff;
      --ember: #e8a317;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
      --gutter: clamp(14px, 3vw, 36px);
      --rail-h: 178px;
      --relic: min(78vw, 340px);
      --type-quote: clamp(15px, 4.4vw, 22px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      overflow-x: clip;
    }
    html, body {
      min-height: 100%;
      background: #050505;
      color: #e6d7bf;
      font-family: "Space Grotesk", sans-serif;
    }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: var(--safe-t) var(--safe-r) calc(var(--rail-h) + var(--safe-b)) var(--safe-l);
    }
    .bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 36% 32% at 50% 34%, rgba(110,50,190,.14), transparent 72%),
        radial-gradient(ellipse 22% 16% at 50% 30%, rgba(232,163,23,.05), transparent 70%),
        #050505;
    }
    .bg::after {
      content: "";
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: .08; mix-blend-mode: overlay;
    }
    .mist {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background:
        radial-gradient(ellipse 34% 30% at 50% 36%, rgba(128,64,200,.2), transparent 66%);
    }
    .frame {
      display: block;
      pointer-events: none;
      position: fixed;
      top: 0;
      bottom: var(--rail-h);
      width: 72px;
      z-index: 3;
      overflow: hidden;
    }
    .frame img {
      position: absolute;
      top: -18%;
      left: 0;
      width: 100%;
      height: 136%;
      object-fit: cover;
      display: block;
    }
    .frame.left { left: 0; }
    .frame.left img { object-position: left center; }
    .frame.right { right: 0; }
    .frame.right img { object-position: right center; }
    .frame.left {
      -webkit-mask-image: linear-gradient(to right, #000 0%, #000 58%, transparent 100%);
      mask-image: linear-gradient(to right, #000 0%, #000 58%, transparent 100%);
    }
    .frame.right {
      -webkit-mask-image: linear-gradient(to left, #000 0%, #000 58%, transparent 100%);
      mask-image: linear-gradient(to left, #000 0%, #000 58%, transparent 100%);
    }
    .frame::before {
      content: "";
      position: absolute; left: 0; right: 0; top: 0;
      height: 28%;
      min-height: 96px;
      background: linear-gradient(to bottom, #050505 0%, rgba(5,5,5,.94) 45%, transparent 100%);
      z-index: 1;
    }
    .frame::after {
      content: "";
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 56px;
      background: linear-gradient(to bottom, transparent, #050505);
    }
    .gate {
      display: none;
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
    }
    .gate picture {
      display: block;
      width: 100%;
      height: 100%;
    }
    .gate img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      -webkit-mask-image:
        linear-gradient(to right,
          #000 0%, #000 9%, rgba(0,0,0,.55) 12%, transparent 16.5%,
          transparent 83.5%, rgba(0,0,0,.55) 88%, #000 91%, #000 100%),
        linear-gradient(to bottom, #000 0%, #000 56%, rgba(0,0,0,.3) 70%, transparent 86%);
      mask-image:
        linear-gradient(to right,
          #000 0%, #000 9%, rgba(0,0,0,.55) 12%, transparent 16.5%,
          transparent 83.5%, rgba(0,0,0,.55) 88%, #000 91%, #000 100%),
        linear-gradient(to bottom, #000 0%, #000 56%, rgba(0,0,0,.3) 70%, transparent 86%);
      -webkit-mask-composite: source-in;
      mask-composite: intersect;
    }
    .gate::before {
      content: "";
      position: absolute; left: 0; right: 0; top: 0; height: 32%;
      background:
        linear-gradient(to right, rgba(5,5,5,.75) 0%, rgba(5,5,5,.97) 6%, rgba(5,5,5,.97) 22%, transparent 30%),
        linear-gradient(to left, rgba(5,5,5,.85) 0%, rgba(5,5,5,.98) 8%, rgba(5,5,5,.98) 22%, transparent 32%);
    }
    .gate::after {
      content: "";
      position: absolute; left: 0; right: 0; bottom: 0; height: 52%;
      background: linear-gradient(180deg, transparent 0%, rgba(5,5,5,.3) 26%, rgba(5,5,5,.88) 52%, #050505 76%);
    }
    #fx { position: fixed; inset: 0; z-index: 2; pointer-events: none; }

    header {
      position: relative; z-index: 5; flex: none;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px var(--gutter) 8px;
    }
    .brand {
      font-family: "Cinzel Decorative", serif;
      font-size: clamp(12px, 2.2vw, 16px);
      letter-spacing: .28em; color: var(--bronze);
    }
    .brand small {
      display: block; font-family: "Space Grotesk", sans-serif;
      letter-spacing: .22em; font-size: 9px; color: #7d6c52; margin-top: 3px;
    }
    .chip {
      border: 1px solid rgba(196,165,116,.35);
      color: var(--bronze);
      font-size: 10px; letter-spacing: .2em;
      padding: 7px 10px;
      background: rgba(0,0,0,.35);
    }

    .altar {
      position: relative; z-index: 4;
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 0 var(--gutter);
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      align-content: center;
      justify-items: center;
      container-type: inline-size;
      container-name: altar;
    }
    .wave {
      display: none;
      width: min(640px, 72vw);
      height: 42px;
      margin: 0 auto -6px;
      opacity: .55;
    }
    .wave path { fill: none; stroke: url(#wg); stroke-width: 1.4; }
    .relic {
      width: var(--relic);
      aspect-ratio: 1;
      position: relative;
      display: grid; place-items: center;
    }
    .halo {
      position: absolute; inset: -10%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(155,92,255,.4), rgba(232,163,23,.08) 42%, transparent 68%);
      filter: blur(16px);
      opacity: .45;
    }
    .ring {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(196,165,116,.28);
      box-shadow: 0 0 40px rgba(120,60,200,.25), inset 0 0 30px rgba(0,0,0,.55);
    }
    .relic img {
      width: 86%; height: 86%;
      object-fit: cover;
      border-radius: 50%;
      transform: scale(1);
      box-shadow: 0 20px 50px rgba(0,0,0,.65);
    }
    .cracks {
      position: absolute;
      width: 86%; height: 86%;
      pointer-events: none;
      z-index: 3;
      overflow: visible;
    }
    .cracks .stg { opacity: 0; transition: opacity .28s ease; }
    .cracks[data-stage="1"] [data-n="1"],
    .cracks[data-stage="2"] [data-n="1"],
    .cracks[data-stage="2"] [data-n="2"],
    .cracks[data-stage="3"] [data-n="1"],
    .cracks[data-stage="3"] [data-n="2"],
    .cracks[data-stage="3"] [data-n="3"],
    .cracks[data-stage="4"] .stg { opacity: 1; }
    .cracks path {
      fill: none;
      stroke: #e8a317;
      stroke-width: 1.35;
      stroke-linecap: round;
      filter: drop-shadow(0 0 3px rgba(232,163,23,.85));
    }
    .cracks[data-stage="4"] path { stroke: #f3d08a; }
    .vein {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px 4px;
      width: min(var(--relic), 100%);
      margin: 8px auto 0;
      z-index: 4;
    }
    .vein .rune {
      width: 12px; height: 16px;
      padding: 0; border: 1px solid #3a3228;
      background: #14110e;
      clip-path: polygon(50% 0, 100% 22%, 100% 78%, 50% 100%, 0 78%, 0 22%);
      cursor: pointer;
      box-shadow: inset 0 0 4px #000;
    }
    .vein .rune.sealed { background: #0e0c0a; border-color: #2a241c; opacity: .55; }
    .vein .rune.ember {
      background: #c47a12; border-color: #e8a317;
      box-shadow: 0 0 8px rgba(232,163,23,.65);
    }
    .vein .rune.live, .vein .rune.open {
      background: #6b3cff; border-color: #9b5cff;
      box-shadow: 0 0 8px rgba(155,92,255,.7);
    }
    .vein .rune.current { outline: 1px solid #d7c39a; outline-offset: 1px; }
    .hint {
      text-align: center;
      font-family: "Cinzel", serif;
      letter-spacing: .18em;
      font-size: clamp(10px, 2.6vw, 12px);
      color: var(--ember);
      min-height: 18px;
      margin-top: 10px;
    }
    .quote {
      text-align: center;
      font-family: "Cinzel", serif;
      font-size: var(--type-quote);
      line-height: 1.35;
      color: #f0e2c8;
      max-width: 22em;
      margin: 18px auto 8px;
      text-shadow: 0 2px 16px rgba(0,0,0,.9);
    }
    .quote cite {
      display: block; margin-top: 8px;
      font-style: normal; font-size: 11px;
      letter-spacing: .2em; color: #8a7350;
    }
    .actions {
      display: grid; gap: 8px;
      margin: 16px auto 0;
      width: min(420px, 100%);
    }
    .plate {
      appearance: none; width: 100%;
      background-color: #120f0c;
      background-image:
        linear-gradient(180deg, rgba(18,14,10,.94), rgba(8,6,5,.96)),
        url("scene/plate-metal.webp");
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(196,165,116,.4);
      color: #e8d7b5;
      font-family: "Cinzel", serif;
      letter-spacing: .14em;
      font-size: clamp(11px, 2.8vw, 13px);
      padding: 14px 12px;
      text-transform: uppercase;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 8px 24px rgba(0,0,0,.4);
      cursor: pointer;
    }
    .plate.primary { border-color: rgba(232,163,23,.55); color: var(--ember); }
    .plate:active { transform: scale(.99); }
    .plate[hidden], .links[hidden] { display: none !important; }
    .links { display: grid; gap: 8px; }
    .links a { text-decoration: none; text-align: center; display: block; }

    .rail {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
      padding: 10px 0 calc(10px + var(--safe-b));
      background: linear-gradient(180deg, transparent, rgba(5,5,5,.96) 18%, #050505 36%);
    }
    .rail-scroll {
      display: flex; gap: 10px;
      overflow-x: auto;
      padding: 8px var(--gutter) 4px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
    }
    .rail-scroll::-webkit-scrollbar { height: 0; }
    .tab { flex: 0 0 92px; scroll-snap-align: center; }
    .tab button {
      width: 92px; height: 122px;
      border: 1px solid rgba(196,165,116,.28);
      background: #120f0d;
      padding: 0; position: relative; overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,.45);
      cursor: pointer;
    }
    .tab img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tab.sealed img { object-fit: cover; filter: grayscale(.45) brightness(.72); }
    .tab.ember img { object-fit: cover; filter: none; }
    .tab.sealed button::after {
      content: "";
      position: absolute; inset: 0;
      background: url("scene/tab-sealed-c.webp") center/cover;
      opacity: .7; pointer-events: none;
    }
    .tab.live button::after {
      content: "";
      position: absolute; inset: 0;
      background: url("scene/tab-live-b.webp") center/cover;
      mix-blend-mode: screen; opacity: .45; pointer-events: none;
    }
    .tab .lock { display: none; }
    .tab.live button { box-shadow: 0 0 16px rgba(155,92,255,.35); border-color: #9b5cff; }
    .tab.ember button { box-shadow: 0 0 16px rgba(232,163,23,.4); border-color: var(--ember); }
    .tab.current button { outline: 1px solid var(--bronze); }
    .tab label {
      display: block; margin-top: 6px;
      font-size: 8px; letter-spacing: .08em;
      text-align: center; color: #8d7a5c; text-transform: uppercase;
    }
    .tab .eta {
      display: block;
      margin-top: 3px;
      font-size: 8px;
      letter-spacing: .04em;
      text-align: center;
      color: var(--ember);
      font-variant-numeric: tabular-nums;
      min-height: 10px;
    }
    .toast {
      position: fixed; top: calc(52px + var(--safe-t)); left: 50%; transform: translateX(-50%);
      z-index: 12; background: #0b0908; border: 1px solid rgba(196,165,116,.35);
      padding: 8px 12px; font-size: 11px; letter-spacing: .12em;
      opacity: 0; pointer-events: none; transition: opacity .25s;
      max-width: calc(100% - 32px);
    }
    .toast.on { opacity: 1; }
    .bp { display: none; }

    /* —— phone portrait —— */
    @media (max-width: 767px) {
      --relic: min(64vw, 270px);
      --rail-h: 168px;
      --gutter: 16px;
      --type-quote: clamp(15px, 4.2vw, 18px);
      .gate { display: none !important; }
      .frame { display: block; width: 64px; }
      header {
        padding: 12px 56px 2px;
      }
      .chip {
        background: rgba(5,5,5,.78);
        backdrop-filter: blur(6px);
      }
      .altar {
        align-content: start;
        padding: 8px 58px 12px;
      }
      .relic { margin-top: 8px; }
      .hint { margin-top: 8px; min-height: 16px; }
      .quote { margin: 10px auto 0; max-width: 15.5em; font-size: 15px; }
      .actions { margin-top: 14px; width: 100%; }
      .plate { padding: 13px 10px; }
      .tab { flex: 0 0 80px; }
      .tab button { width: 80px; height: 106px; }
      .rail-scroll { padding-left: 16px; padding-right: 16px; gap: 8px; }
    }

    /* —— phone landscape / short viewport —— */
    @media (max-height: 560px) and (orientation: landscape) {
      --relic: min(38vh, 220px);
      --rail-h: 136px;
      .quote { font-size: 14px; margin: 8px auto; }
      .hint { margin-top: 4px; }
      .altar {
        grid-template-columns: var(--relic) 1fr;
        align-items: center; gap: 8px 24px;
      }
      .wave { display: none !important; }
      .relic { grid-row: span 4; }
      .actions { margin-top: 8px; width: 100%; }
    }

    /* —— large phone —— */
    @media (min-width: 480px) and (max-width: 767px) {
      --relic: min(58vw, 280px);
      --rail-h: 172px;
      .tab { flex: 0 0 86px; }
      .tab button { width: 86px; height: 114px; }
    }

    /* —— tablet —— */
    @media (min-width: 768px) {
      --relic: min(46vw, 400px);
      --rail-h: 218px;
      --type-quote: clamp(18px, 2.4vw, 24px);
      .gate { display: block !important; }
      .frame {
        display: block;
        width: min(16vw, 230px);
      }
      .wave { display: block; }
      .actions { width: min(560px, 100%); }
      .links { grid-template-columns: 1fr 1fr 1fr; }
      .tab { flex: 0 0 118px; }
      .tab button { width: 118px; height: 156px; }
      .tab label { font-size: 9px; }
      .gate img {
        object-position: center center;
        -webkit-mask-image:
          linear-gradient(to right,
            #000 0%, #000 11%, rgba(0,0,0,.6) 14%, transparent 18%,
            transparent 82%, rgba(0,0,0,.6) 86%, #000 89%, #000 100%),
          linear-gradient(to bottom, #000 0%, #000 54%, rgba(0,0,0,.3) 68%, transparent 85%);
        mask-image:
          linear-gradient(to right,
            #000 0%, #000 11%, rgba(0,0,0,.6) 14%, transparent 18%,
            transparent 82%, rgba(0,0,0,.6) 86%, #000 89%, #000 100%),
          linear-gradient(to bottom, #000 0%, #000 54%, rgba(0,0,0,.3) 68%, transparent 85%);
        -webkit-mask-composite: source-in;
        mask-composite: intersect;
      }
    }

    /* —— desktop altar (planche maître) —— */
    @media (min-width: 1100px) {
      --relic: 420px;
      --rail-h: 240px;
      body { padding-left: 11vw; padding-right: 11vw; }
      .gate img {
        -webkit-mask-image:
          linear-gradient(to right,
            #000 0%, #000 12%, rgba(0,0,0,.65) 15%, transparent 19%,
            transparent 81%, rgba(0,0,0,.65) 85%, #000 88%, #000 100%),
          linear-gradient(to bottom, #000 0%, #000 52%, rgba(0,0,0,.28) 66%, transparent 84%);
        mask-image:
          linear-gradient(to right,
            #000 0%, #000 12%, rgba(0,0,0,.65) 15%, transparent 19%,
            transparent 81%, rgba(0,0,0,.65) 85%, #000 88%, #000 100%),
          linear-gradient(to bottom, #000 0%, #000 52%, rgba(0,0,0,.28) 66%, transparent 84%);
        -webkit-mask-composite: source-in;
        mask-composite: intersect;
      }
      .wave { width: 720px; height: 52px; }
      .actions { width: min(760px, 100%); }
      .links { grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .tab { flex: 0 0 132px; }
      .tab button { width: 132px; height: 176px; }
    }

    /* —— ultra wide : keep altar centered, don't stretch relics —— */
    @media (min-width: 1600px) {
      --relic: 460px;
      .altar { width: 1240px; }
    }

    /* hover only when a pointer exists */
    @media (hover: hover) and (pointer: fine) {
      .plate:hover { border-color: var(--violet); box-shadow: 0 0 18px rgba(155,92,255,.22); }
      .plate.primary:hover { border-color: var(--ember); }
      .tab button:hover { transform: translateY(-3px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .halo, .relic img, .tab button { transition: none !important; }
      #fx { display: none; }
      .mist { animation: none; }
    }

    @container altar (min-width: 700px) {
      .quote { max-width: 28em; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="mist" aria-hidden="true"></div>
  <div class="frame left" aria-hidden="true"><img src="scene/frame-left.png" alt="" /></div>
  <div class="frame right" aria-hidden="true"><img src="scene/frame-right.png" alt="" /></div>
  <div class="gate" aria-hidden="true">
    <picture>
      <source media="(min-width: 768px)" srcset="scene/bg-desktop.webp" />
      <img src="scene/bg-desktop.webp" alt="" />
    </picture>
  </div>
  <canvas id="fx"></canvas>
  <div class="toast" id="toast"></div>
  <div class="bp" id="bp"></div>

  <header>
    <div class="brand">WILD OHM<small>DARK RITUAL</small></div>
  </header>

  <main class="altar">
    <svg class="wave" viewBox="0 0 720 52" aria-hidden="true">
      <defs>
        <linearGradient id="wg" x1="0" x2="1">
          <stop offset="0" stop-color="#e8a317"/>
          <stop offset=".5" stop-color="#b07cff"/>
          <stop offset="1" stop-color="#e8a317"/>
        </linearGradient>
      </defs>
      <path id="wavePath" d="M0 26 Q 60 26 90 26 T 180 26 T 270 26 T 360 26 T 450 26 T 540 26 T 630 26 T 720 26"/>
    </svg>

    <div class="relic" id="relic">
      <div class="halo" id="halo"></div>
      <div class="ring" id="ring"></div>
      <img id="hero" src="covers/hard-fiction.jpg" alt="Hard Fiction" />
      <svg class="cracks" id="cracks" viewBox="0 0 200 200" data-stage="0" aria-hidden="true">
        <g class="stg" data-n="1">
          <path d="M102 18 L108 46 L96 70 L112 98"/>
        </g>
        <g class="stg" data-n="2">
          <path d="M48 62 L78 88 L70 118 L92 142"/>
          <path d="M78 88 L104 92"/>
        </g>
        <g class="stg" data-n="3">
          <path d="M150 54 L128 86 L146 114 L124 148"/>
          <path d="M128 86 L108 108"/>
        </g>
        <g class="stg" data-n="4">
          <path d="M100 8 L104 52 L88 96 L110 132 L98 192"/>
          <path d="M88 96 L60 120 M110 132 L148 150"/>
        </g>
      </svg>
    </div>
    <div class="vein" id="vein" aria-label="Veine des 17 runes"></div>
    <p class="hint" id="hint">TOUCHEZ LE SCEAU · 4 FRAPPES</p>
    <p class="quote" id="quote">
      « La fiction est un diner où les morts paient l’addition. »
      <cite>— HARD FICTION</cite>
    </p>

    <div class="actions">
      <button class="plate primary" id="unlock">Déverrouiller le rituel · 4 frappes</button>
      <div class="links" id="links" hidden>
        <a class="plate" href="https://open.spotify.com" target="_blank" rel="noopener">Spotify</a>
        <a class="plate" href="https://music.apple.com" target="_blank" rel="noopener">Apple Music</a>
        <a class="plate" href="https://youtube.com" target="_blank" rel="noopener">YouTube</a>
      </div>
    </div>
  </main>

  <nav class="rail" aria-label="Les 17 rites">
    <div class="rail-scroll" id="rail"></div>
  </nav>

  <script>
    const RITES = [
      { id: "ritual-drop", title: "Ritual Drop", cover: "covers/ritual-drop.jpg", state: "live",
        quote: "Le premier sceau s’ouvre sans bruit." },
      { id: "chestbreaker", title: "Chestbreaker", cover: "covers/chestbreaker.jpg", state: "live",
        quote: "La cage thoracique est un temple trop étroit." },
      { id: "ashtray", title: "Ashtray", cover: "covers/ashtray.jpg", state: "live",
        quote: "On écrase le jour dans le même plat." },
      { id: "squelch-pit", title: "Squelch Pit", cover: "covers/squelch-pit.jpg", state: "live",
        quote: "Ce qui bout sous la terre n’a pas de nom propre." },
      { id: "lm", title: "L&M", cover: "covers/lm.jpg", state: "live",
        quote: "Le lait refroidit. La ville, non." },
      { id: "root-canal", title: "Root Canal", cover: "covers/root-canal.jpg", state: "live",
        quote: "On soigne la racine en réveillant la foudre." },
      { id: "whispering-wood", title: "Whispering Wood", cover: "covers/whispering-wood.jpg", state: "live",
        quote: "Le bois parle plus bas que le kick." },
      { id: "rolling-temple", title: "Rolling Temple", cover: "covers/rolling-temple.jpg", state: "live",
        quote: "Le temple avance. On n’entre pas : on est pris." },
      { id: "hard-fiction", title: "Hard Fiction", cover: "covers/hard-fiction.jpg", state: "ember",
        quote: "La fiction est un diner où les morts paient l’addition.", current: true },
      { id: "w10", title: "Rite X", cover: "covers/sigil.jpg", state: "sealed" },
      { id: "w11", title: "Rite XI", cover: "covers/sigil.jpg", state: "sealed" },
      { id: "w12", title: "Rite XII", cover: "covers/sigil.jpg", state: "sealed" },
      { id: "w13", title: "Rite XIII", cover: "covers/sigil.jpg", state: "sealed" },
      { id: "w14", title: "Rite XIV", cover: "covers/sigil.jpg", state: "sealed" },
      { id: "w15", title: "Rite XV", cover: "covers/sigil.jpg", state: "sealed" },
      { id: "w16", title: "Rite XVI", cover: "covers/sigil.jpg", state: "sealed" },
      { id: "w17", title: "Rite XVII", cover: "covers/sigil.jpg", state: "sealed" }
    ];

    const $ = (id) => document.getElementById(id);
    const rail = $("rail");
    const hero = $("hero");
    const hint = $("hint");
    const quote = $("quote");
    const links = $("links");
    const unlockBtn = $("unlock");
    const toast = $("toast");
    const halo = $("halo");
    const ring = $("ring");
    const wavePath = $("wavePath");
    const bp = $("bp");

    let current = RITES.find(r => r.current) || RITES[8];
    const STORE = "wild-ohm-unlocks";
    let unlocked = {};
    try { unlocked = JSON.parse(localStorage.getItem(STORE) || "{}") || {}; } catch (e) { unlocked = {}; }
    function saveUnlocks() {
      try { localStorage.setItem(STORE, JSON.stringify(unlocked)); } catch (e) {}
    }

    function riteState(r) {
      if (unlocked[r.id]) return "live";
      return r.state || "sealed";
    }
    function setCrack(n) {
      const el = $("cracks");
      if (el) el.dataset.stage = String(Math.max(0, Math.min(4, n)));
    }
    function renderVein() {
      const vein = $("vein");
      if (!vein) return;
      vein.innerHTML = RITES.map(r => {
        const st = riteState(r);
        const cur = r.id === current.id ? " current" : "";
        return `<button type="button" class="rune ${st}${cur}" data-id="${r.id}" aria-label="${publicName(r)}"></button>`;
      }).join("");
      vein.querySelectorAll(".rune").forEach(el => {
        el.addEventListener("click", () => select(el.dataset.id));
      });
    }
    const ROMAN = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII"];
    function publicName(r) {
      const st = riteState(r);
      if (st === "live" || st === "ember") return r.title;
      const i = RITES.indexOf(r);
      return "Rite " + (ROMAN[i] || String(i + 1));
    }
    function pad2(n) { return String(n).padStart(2, "0"); }
    function fmtEta(ms) {
      if (ms <= 0) return "00:00:00";
      const s = Math.floor(ms / 1000);
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      return d > 0 ? `${d}j ${pad2(h)}:${pad2(m)}:${pad2(sec)}` : `${pad2(h)}:${pad2(m)}:${pad2(sec)}`;
    }

    function labelBp() {
      const w = innerWidth, h = innerHeight;
      let name = "phone";
      if (h <= 560 && w > h) name = "phone-landscape";
      else if (w >= 1600) name = "ultrawide";
      else if (w >= 1100) name = "desktop-altar";
      else if (w >= 768) name = "tablet";
      else if (w >= 480) name = "phone-lg";
      bp.textContent = name + " · " + w + "×" + h;
    }
    addEventListener("resize", labelBp); labelBp();

    function say(msg) {
      toast.textContent = msg;
      toast.classList.add("on");
      clearTimeout(say.t);
      say.t = setTimeout(() => toast.classList.remove("on"), 1600);
    }

    function renderRail() {
      rail.innerHTML = RITES.map(r => {
        const st = riteState(r);
        const skin = st === "sealed" ? "scene/tab-sealed-b.webp"
          : st === "ember" ? "scene/tab-ember.webp"
          : r.cover;
        const shown = publicName(r);
        const eta = r.dropAt ? `<span class="eta" data-eta="${r.id}"></span>` : "";
        return `<div class="tab ${st} ${r.id === current.id ? "current" : ""}" data-id="${r.id}">
          <button type="button" aria-label="${shown}">
            <img src="${skin}" alt="" />
          </button>
          <label>${shown}</label>
          ${eta}
        </div>`;
      }).join("");
      rail.querySelectorAll(".tab").forEach(el => {
        el.addEventListener("click", () => select(el.dataset.id));
      });
      updateEtaLabels();
      renderVein();
    }

    function updateEtaLabels() {
      RITES.forEach(r => {
        if (!r.dropAt) return;
        const el = rail.querySelector(`[data-eta="${r.id}"]`);
        if (!el) return;
        const st = riteState(r);
        const left = r.dropAt - Date.now();
        el.textContent = st === "sealed" && left > 0 ? fmtEta(left) : (st === "ember" ? "4 FRAPPES" : "");
      });
    }

    function tickTimers() {
      let flipped = false;
      RITES.forEach(r => {
        const st = riteState(r);
        if (r._prev === "sealed" && st !== "sealed") flipped = true;
        r._prev = st;
      });
      if (flipped) renderRail();
      else updateEtaLabels();
      syncAltar();
    }

    function syncAltar() {
      const r = current;
      const st = riteState(r);
      const open = st === "live";
      const canUnlock = st === "ember";
      hero.src = (open || canUnlock) ? r.cover : "covers/sigil.jpg";
      hero.alt = publicName(r);
      const line = (open || canUnlock) ? (r.quote || "Le sceau attend.") : "Le sceau attend.";
      quote.innerHTML = `« ${line} »<cite>— ${publicName(r).toUpperCase()}</cite>`;
      links.hidden = !open;
      unlockBtn.hidden = open || !canUnlock;
      halo.style.background = canUnlock
        ? "radial-gradient(circle, rgba(232,163,23,.55), rgba(232,163,23,.08) 42%, transparent 68%)"
        : "radial-gradient(circle, rgba(155,92,255,.4), rgba(232,163,23,.08) 42%, transparent 68%)";
      if (open) hint.textContent = "RITE OUVERT";
      else if (canUnlock) hint.textContent = "TOUCHEZ LE SCEAU · 4 FRAPPES";
      else hint.textContent = "CE RITE N’A PAS ENCORE LIEU";
    }

    function select(id) {
      const r = RITES.find(x => x.id === id);
      if (!r) return;
      current = r;
      taps.length = 0;
      setCrack(0);
      syncAltar();
      renderRail();
      const node = rail.querySelector(`[data-id="${id}"]`);
      if (node) node.scrollIntoView({ inline: "center", behavior: "smooth", block: "nearest" });
    }

    let ac, master, amb, react, analyser;
    const freq = new Uint8Array(512);
    let kickEnv = 0, lastKick = 0;

    function ensureAudio() {
      if (ac) return ac.resume();
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.85; master.connect(ac.destination);
      amb = ac.createGain(); amb.gain.value = 0.28; amb.connect(master);
      react = ac.createGain(); react.gain.value = 0.8;
      analyser = ac.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.72;
      react.connect(analyser); analyser.connect(master);
      rumble();
      return ac.resume();
    }
    function noiseBuf() {
      const b = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return b;
    }
    function rumble() {
      const o = ac.createOscillator(); o.type = "sine"; o.frequency.value = 42;
      const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 90;
      const g = ac.createGain(); g.gain.value = 0.06;
      o.connect(f); f.connect(g); g.connect(amb); o.start();
      const src = ac.createBufferSource(); src.buffer = noiseBuf(); src.loop = true;
      const nf = ac.createBiquadFilter(); nf.type = "lowpass"; nf.frequency.value = 110;
      const ng = ac.createGain(); ng.gain.value = 0.04;
      src.connect(nf); nf.connect(ng); ng.connect(amb); src.start();
    }
    function kick() {
      if (!ac) return;
      const now = ac.currentTime;
      const o = ac.createOscillator(); o.type = "sine";
      const g = ac.createGain();
      o.frequency.setValueAtTime(130, now);
      o.frequency.exponentialRampToValueAtTime(36, now + 0.16);
      g.gain.setValueAtTime(0.9, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
      o.connect(g); g.connect(react);
      o.start(now); o.stop(now + 0.28);
      kickEnv = 1; spawnBolt();
    }
    function stone() {
      if (!ac) return;
      const now = ac.currentTime;
      const src = ac.createBufferSource(); src.buffer = noiseBuf();
      const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 800; f.Q.value = 2;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.15, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      src.connect(f); f.connect(g); g.connect(amb);
      src.start(now); src.stop(now + 0.2);
    }

    const canvas = $("fx");
    const ctx = canvas.getContext("2d");
    const bolts = [];
    function resize() {
      const d = Math.min(devicePixelRatio || 1, 2);
      canvas.width = innerWidth * d; canvas.height = innerHeight * d;
      canvas.style.width = innerWidth + "px"; canvas.style.height = innerHeight + "px";
      ctx.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function spawnBolt() {
      bolts.push({ a: Math.random() * Math.PI * 2, life: 1, n: 7 + Math.random() * 5 });
    }
    function drawWave(amp) {
      if (!wavePath) return;
      let d = "M0 26";
      for (let x = 0; x <= 720; x += 12) {
        const y = 26 + Math.sin(x * 0.08) * (6 + amp * 16) * Math.sin(x * 0.02 + amp);
        d += ` L${x} ${y.toFixed(1)}`;
      }
      wavePath.setAttribute("d", d);
    }
    function frame(t) {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      if (analyser) {
        analyser.getByteFrequencyData(freq);
        let low = 0;
        for (let i = 1; i < 8; i++) low += freq[i];
        low /= 7 * 255;
        if (low > 0.4 && t - lastKick > 150) { lastKick = t; kickEnv = Math.max(kickEnv, low * 1.4); spawnBolt(); }
      }
      kickEnv *= 0.86;
      hero.style.transform = `scale(${1 + kickEnv * 0.045})`;
      halo.style.opacity = String(0.3 + kickEnv * 0.6);
      halo.style.transform = `scale(${1.02 + kickEnv * 0.1})`;
      ring.style.boxShadow = `0 0 ${24 + kickEnv * 70}px rgba(155,92,255,${0.2 + kickEnv * 0.5})`;
      drawWave(kickEnv);
      const relic = $("relic").getBoundingClientRect();
      const cx = relic.left + relic.width / 2;
      const cy = relic.top + relic.height / 2;
      const len = relic.width * 0.42;
      for (let i = bolts.length - 1; i >= 0; i--) {
        const b = bolts[i]; b.life -= 0.08;
        if (b.life <= 0) { bolts.splice(i, 1); continue; }
        ctx.beginPath(); ctx.moveTo(cx, cy);
        for (let s = 1; s <= b.n; s++) {
          const p = s / b.n;
          ctx.lineTo(cx + Math.cos(b.a) * len * p + (Math.random() - .5) * 16,
                     cy + Math.sin(b.a) * len * p + (Math.random() - .5) * 16);
        }
        ctx.strokeStyle = `rgba(190,140,255,${b.life})`;
        ctx.lineWidth = 1.4 + b.life; ctx.stroke();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    const taps = [];
    const TARGET = 60000 / 150;

    async function tapSeal() {
      await ensureAudio();
      const st = riteState(current);
      if (st === "sealed") {
        stone();
        say(current.dropAt ? "PAS ENCORE L’HEURE" : "SCEAU VERROUILLÉ");
        return;
      }
      if (st === "live") {
        kick(); return;
      }
      const now = performance.now();
      taps.push(now);
      if (taps.length > 4) taps.shift();
      hint.textContent = `INVOCATION  ${taps.length}/4`;
      setCrack(taps.length);
      kick();
      if (taps.length === 4) {
        const iv = [taps[1]-taps[0], taps[2]-taps[1], taps[3]-taps[2]];
        const ok = iv.every(v => Math.abs(v - TARGET) / TARGET < 0.14);
        if (ok) {
          unlocked[current.id] = true;
          current.state = "live";
          saveUnlocks();
          setCrack(4);
          hint.textContent = "SCEAU BRISÉ";
          links.hidden = false;
          unlockBtn.hidden = true;
          say("RITE OUVERT");
          spawnBolt(); spawnBolt();
          renderRail();
          if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
        } else {
          hint.textContent = "LE TEMPO N’A PAS RÉPONDU";
          say("4 FRAPPES À ~150 BPM");
          setCrack(0);
        }
        taps.length = 0;
      }
    }

    $("relic").addEventListener("click", tapSeal);
    unlockBtn.addEventListener("click", tapSeal);

    renderRail();
    syncAltar();
    setInterval(tickTimers, 1000);
    requestAnimationFrame(() => {
      const node = rail.querySelector(`[data-id="${current.id}"]`);
      if (node) node.scrollIntoView({ inline: "center", block: "nearest" });
    });
  </script>
</body>
</html>
